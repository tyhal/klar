merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions:
      - status-success=klar-test
pull_request_rules:
  - name: automatic merge for Renovate pull requests
    conditions:
      - base=main
      - author=renovate[bot]
    actions:
      queue:
        name: default
